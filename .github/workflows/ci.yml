name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: '0 2 * * *'
  # The jobs that need a live storage service are gated on this, so they can
  # still be run deliberately once there is a service for them to reach.
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # Markdown was checked by nobody: `lint` and `format` cover
  # {lib,examples,test}/**/*.js and nothing else. Two README links pointed at a
  # demo that had moved repositories months earlier, and six URLs carried the npm
  # scope in the GitHub path after the rename -- all of it invisible to CI.
  #
  # Relative paths and heading anchors are facts about this repository and are
  # fatal. External URLs fail only on 404/410: a 403 from npmjs.com is somebody
  # else's bot policy, and a pipeline that reddens on that is one everybody
  # learns to ignore. Those are printed instead.
  link-check:
    name: Links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No npm ci on purpose: the checker has no dependencies, so this job stays
      # a few seconds long and cannot be broken by the lockfile.
      - name: Check links
        run: npm run check:links
  # No credentials, no network: the protocol logic against an in-memory courier.
  # Runs beside lint rather than behind the Storacha chain, so a fork without
  # secrets still gets a signal — and so the suite downstream projects depend on
  # cannot rot unnoticed, which it could until now: it ran in no job at all.
  courier-sync-tests:
    name: Courier Sync (no secrets)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run courier-sync tests
        run: npx jest test/courier-sync.test.js test/restore-cid.test.js --forceExit
        env:
          NODE_OPTIONS: '--experimental-vm-modules --no-warnings'

      # The storage backend contract, the Aleph driver against a stub of its
      # host, CAR-first backup and restore. None of it needs a secret, and none
      # of it ran in CI — which is how a driver that broke every named backup
      # passed. aleph-live.test.js skips itself unless ALEPH_LIVE=true.
      - name: Run storage backend tests
        run: npx jest test/backends/ --forceExit
        env:
          NODE_OPTIONS: '--experimental-vm-modules --no-warnings'

  # The Storacha suites below run against the in-memory service in test/helpers
  # unless USE_PRODUCTION_STORACHA is set, and the real service was
  # decommissioned in 2026. So they take no credentials, and nothing clears a
  # space first: the space they would clear no longer exists.
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm run test:integration
        env:
          NODE_OPTIONS: '--experimental-vm-modules --no-warnings'
          DEBUG: 'libp2p:*'

      - name: Clean up test artifacts
        if: always()
        run: npm run clean

  car-backup-tests:
    name: CAR Backup Tests
    runs-on: ubuntu-latest
    needs: [integration-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run CAR backup tests
        run: npm run test:car-backup
        env:
          NODE_OPTIONS: '--experimental-vm-modules --no-warnings'
          DEBUG: 'libp2p:*'

      - name: Clean up test artifacts
        if: always()
        run: npm run clean

  p256-ucan-tests:
    name: P256 UCAN Security Tests
    runs-on: ubuntu-latest
    needs: [car-backup-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run P256 UCAN tests
        run: npm run test:p256-ucan
        env:
          NODE_OPTIONS: '--experimental-vm-modules --no-warnings'
          DEBUG: 'libp2p:*'

      - name: Clean up test artifacts
        if: always()
        run: npm run clean
  timestamped-backup-tests:
    name: Timestamped Backup Tests
    runs-on: ubuntu-latest
    needs: [p256-ucan-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run timestamped backup tests
        run: npm run test:timestamped-backup
        env:
          NODE_OPTIONS: '--experimental-vm-modules --no-warnings'
          DEBUG: 'libp2p:*'

      - name: Clean up test artifacts
        if: always()
        run: npm run clean

  network-download-tests:
    name: Network Download Tests
    runs-on: ubuntu-latest
    needs: [timestamped-backup-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run network download tests
        run: npm test -- test/network-download.test.js
        env:
          NODE_OPTIONS: '--experimental-vm-modules --no-warnings'
          DEBUG: 'libp2p:*'

      - name: Clean up test artifacts
        if: always()
        run: npm run clean

  e2e-tests-simple:
    name: E2E Tests (simple-backup-restore)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install example dependencies
        run: npm ci
        working-directory: examples/svelte/simple-backup-restore

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: examples/svelte/simple-backup-restore

      - name: Run E2E tests - simple-backup-restore
        run: npx playwright test
        working-directory: examples/svelte/simple-backup-restore

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-simple-backup-restore
          path: examples/svelte/simple-backup-restore/playwright-report/
          retention-days: 30

  e2e-tests-orbitdb:
    name: E2E Tests (orbitdb-replication)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install example dependencies
        run: npm ci
        working-directory: examples/svelte/orbitdb-replication

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: examples/svelte/orbitdb-replication

      # Starts the relay it replicates through, builds the site and previews it.
      - name: Run E2E tests - orbitdb-replication
        run: npx playwright test
        working-directory: examples/svelte/orbitdb-replication

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-orbitdb-replication
          path: examples/svelte/orbitdb-replication/playwright-report/
          retention-days: 30

  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [lint, courier-sync-tests, integration-tests, car-backup-tests, p256-ucan-tests, timestamped-backup-tests, network-download-tests, e2e-tests-simple, e2e-tests-orbitdb]
    if: always()
    steps:
      - name: Notify Success
        if: needs.lint.result == 'success' && needs.courier-sync-tests.result == 'success' && needs.integration-tests.result == 'success' && needs.e2e-tests-simple.result == 'success' && needs.e2e-tests-orbitdb.result == 'success' && needs.car-backup-tests.result != 'failure' && needs.p256-ucan-tests.result != 'failure' && needs.timestamped-backup-tests.result != 'failure' && needs.network-download-tests.result != 'failure'
        run: |
          echo "✅ All tests passed successfully!"
          echo "🎉 OrbitDB Storage Bridge is working correctly"
          echo "📋 Test Summary:"
          echo "  - Linting: PASSED"
          echo "  - Courier Sync: PASSED"
          echo "  - Integration Tests: PASSED"
          echo "  - CAR Backup Tests: PASSED"
          echo "  - P256 UCAN Tests: PASSED"
          echo "  - Timestamped Backup Tests: PASSED"
          echo "  - Network Download Tests: PASSED"
          echo "  - E2E Tests (simple-backup-restore): PASSED"
      - name: Notify Failure
        if: needs.lint.result == 'failure' || needs.courier-sync-tests.result == 'failure' || needs.integration-tests.result == 'failure' || needs.car-backup-tests.result == 'failure' || needs.p256-ucan-tests.result == 'failure' || needs.timestamped-backup-tests.result == 'failure' || needs.network-download-tests.result == 'failure' || needs.e2e-tests-simple.result == 'failure'
        run: |
          echo "❌ Some tests failed"
          echo "🔍 Please check the logs above for details"
          echo "📋 Test Summary:"
          echo "  - Lint: ${{ needs.lint.result }}"
          echo "  - Courier Sync: ${{ needs.courier-sync-tests.result }}"
          echo "  - Integration Tests: ${{ needs.integration-tests.result }}"
          echo "  - CAR Backup Tests: ${{ needs.car-backup-tests.result }}"
          echo "  - P256 UCAN Tests: ${{ needs.p256-ucan-tests.result }}"
          echo "  - Timestamped Backup Tests: ${{ needs.timestamped-backup-tests.result }}"
          echo "  - Network Download Tests: ${{ needs.network-download-tests.result }}"
          echo "  - E2E Tests (simple-backup-restore): ${{ needs.e2e-tests-simple.result }}"
          exit 1
